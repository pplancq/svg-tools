name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type"
        required: true
        type: choice
        default: "stable"
        options:
          - stable
          - alpha
          - beta
          - rc
      dryRun:
        description: "Dry run"
        required: false
        type: boolean
        default: false
      debug:
        description: "Debug mode"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: pplancq/actions/nx-release@72cc7f266d747ce0558318611cf11857c894e6ff # v1.1.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.releaseType }}
          dry-run: ${{ inputs.dryRun }}
          debug: ${{ inputs.debug }}
          build-command: npm run build:packages
